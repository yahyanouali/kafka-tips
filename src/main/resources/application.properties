# Disable devservices
quarkus.devservices.enabled=false

# HTTP configuration
quarkus.http.port=8888

# Kafka configuration for Quarkus Kafka client
kafka.bootstrap.servers=localhost:29092
kafka.users.topic=users
kafka.user.group.id=users-consumer
schema.registry.url=http://localhost:28081

# Redis configuration for Quarkus Redis client
quarkus.redis.hosts=redis://localhost:26379
